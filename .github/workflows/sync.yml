# Sincroniza Salesforce → Supabase de forma frecuente, sin depender de un
# servicio externo (cron-job.org) que se apaga en silencio.
#
# Por qué así: el cron de GitHub Actions es "best-effort" y retrasa/omite los
# horarios muy frecuentes (p. ej. */10 o los que caen en la hora en punto). Para
# no depender de eso, cada corrida hace VARIOS pings internos (sincroniza, espera
# 5 min, repite) durante ~15 min. Y el disparo se programa con desfase (minutos
# 2,17,32,47) para que GitHub no lo deprioritice. Así, aunque GitHub retrase un
# disparo, el bucle interno mantiene la frecuencia real cerca de 5 min.
#
# REQUISITO (una sola vez): secreto del repo con el mismo valor de CRON_SECRET de
# Vercel:  Settings → Secrets and variables → Actions → New repository secret
#   Name: CRON_SECRET     Value: <el mismo CRON_SECRET de Vercel>
# (Opcional) Variable SYNC_BASE_URL para cambiar la URL sin tocar el código.
name: Sync Salesforce a Supabase

on:
  schedule:
    - cron: '2,17,32,47 * * * *'   # cada 15 min con desfase (GitHub lo respeta mejor)
  workflow_dispatch:
    inputs:
      horas:
        description: 'Ventana incremental en horas. Vacío = sincronización COMPLETA (para ponerse al día).'
        required: false
        default: '3'

# Si un disparo llega mientras otro sigue corriendo, cancela el viejo y arranca
# fresco (evita que se apilen y siempre refleja "ahora").
concurrency:
  group: sync-salesforce
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sincronizar en bucle (varios pings por corrida)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
          EVENT: ${{ github.event_name }}
          IN_HORAS: ${{ github.event.inputs.horas }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Falta el secreto CRON_SECRET en el repo (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          BASE="${SYNC_BASE_URL:-https://helpdesk-monitor-roan.vercel.app}"

          # Manual con horas vacío = sync completo (1 solo ping). Lo demás = incremental.
          if [ "$EVENT" = "workflow_dispatch" ]; then HORAS="${IN_HORAS:-}"; PINGS=1; else HORAS="3"; PINGS=3; fi

          ok=0
          for i in $(seq 1 "$PINGS"); do
            URL="$BASE/api/sync"; [ -n "$HORAS" ] && URL="$URL?horas=$HORAS"
            echo ">>> ping $i/$PINGS  $(date -u +%H:%M:%S)  POST $URL"
            code=$(curl -sS --max-time 300 -o /tmp/out.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $CRON_SECRET" "$URL" || echo "000")
            echo "HTTP $code"; cat /tmp/out.json 2>/dev/null || true; echo
            [ "$code" = "200" ] && ok=$((ok+1))
            # Espera 5 min entre pings (no después del último).
            if [ "$i" -lt "$PINGS" ]; then echo "esperando 5 min…"; sleep 300; fi
          done

          echo "pings OK: $ok/$PINGS"
          # Falla la corrida solo si NINGÚN ping funcionó (para que se note en Actions).
          [ "$ok" -gt 0 ]
